<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <g transform="translate(25, 20)">
    <!-- Top Gold Rule -->
    <line x1="20" y1="30" x2="430" y2="30" stroke="#9E8A4F" stroke-width="3" stroke-linecap="square" />

    <!-- "SPITFIRE" - Bold, Tall Sans-Serif Typography -->
    <text 
      x="225" 
      y="145" 
      font-family="'Oswald', 'League Gothic', 'Arial Narrow', sans-serif" 
      font-size="82" 
      font-weight="700" 
      letter-spacing="9" 
      fill="#29332B" 
      text-anchor="middle"
    >SPITFIRE</text>

    <!-- "HOMES" - Light, Thin Sans-Serif Typography -->
    <text 
      x="225" 
      y="215" 
      font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif" 
      font-size="44" 
      font-weight="200" 
      letter-spacing="16" 
      fill="#29332B" 
      text-anchor="middle"
    >HOMES</text>

    <!-- Bottom Gold Rule -->
    <line x1="20" y1="245" x2="430" y2="245" stroke="#9E8A4F" stroke-width="3" stroke-linecap="square" />
  </g>
</svg>
